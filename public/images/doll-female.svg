  <!-- Waist band -->
  <rect x="27.5" y="55" width="45" height="4.5" rx="2" fill="#88C4DC"/>
  <!-- Skirt hem -->
  <path d="M21,93 Q50,97 79,93" stroke="#88C4DC" stroke-width="1.5" fill="none"/>

  <!-- ══ HANDS ══ -->
  <ellipse cx="14.5" cy="64.5" rx="5.5" ry="4.5" fill="#FDDBB4"/>
  <ellipse cx="85.5" cy="64.5" rx="5.5" ry="4.5" fill="#FDDBB4"/>
  <!-- Finger lines -->
  <path d="M11.5,63 L11.5,66.5" stroke="#D4956A" stroke-width="0.5" stroke-linecap="round"/>
  <path d="M14.5,62.3 L14.5,66.8" stroke="#D4956A" stroke-width="0.5" stroke-linecap="round"/>
  <path d="M17.5,63 L17.5,66.5" stroke="#D4956A" stroke-width="0.5" stroke-linecap="round"/>
  <path d="M82.5,63 L82.5,66.5" stroke="#D4956A" stroke-width="0.5" stroke-linecap="round"/>
  <path d="M85.5,62.3 L85.5,66.8" stroke="#D4956A" stroke-width="0.5" stroke-linecap="round"/>
  <path d="M88.5,63 L88.5,66.5" stroke="#D4956A" stroke-width="0.5" stroke-linecap="round"/>

  <!-- ══ LEGS ══ -->
  <rect x="33" y="91" width="14" height="27" rx="7" fill="#FDDBB4"/>
  <rect x="53" y="91" width="14" height="27" rx="7" fill="#FDDBB4"/>

  <!-- ══ SOCKS ══ -->
  <rect x="33.5" y="110" width="13" height="7" rx="3.5" fill="white"/>
  <rect x="53.5" y="110" width="13" height="7" rx="3.5" fill="white"/>
  <path d="M33.5,110.5 Q40,109 46.5,110.5" stroke="#DEDEDE" stroke-width="0.8" fill="none"/>
  <path d="M53.5,110.5 Q60,109 66.5,110.5" stroke="#DEDEDE" stroke-width="0.8" fill="none"/>

  <!-- ══ SHOES ══ -->
  <ellipse cx="40" cy="119.5" rx="9.5" ry="5" fill="#6A5ACD"/>
  <ellipse cx="60" cy="119.5" rx="9.5" ry="5" fill="#6A5ACD"/>
  <!-- Shoe shine -->
  <ellipse cx="37.5" cy="117.5" rx="2.8" ry="1.5" fill="rgba(255,255,255,0.38)"/>
  <ellipse cx="57.5" cy="117.5" rx="2.8" ry="1.5" fill="rgba(255,255,255,0.38)"/>

</svg>
