  <!-- Blush cheeks -->
  <ellipse cx="41" cy="20" rx="4" ry="2.5" fill="#F08080" opacity="0.28"/>
  <ellipse cx="59" cy="20" rx="4" ry="2.5" fill="#F08080" opacity="0.28"/>

  <!-- Hair ties -->
  <circle cx="32" cy="15" r="2.5" fill="#FF6B6B"/>
  <circle cx="68" cy="15" r="2.5" fill="#FF6B6B"/>
  <circle cx="32" cy="15" r="1" fill="#FFAAAA"/>
  <circle cx="68" cy="15" r="1" fill="#FFAAAA"/>

  <!-- ══ NECK ══ -->
  <rect x="45.5" y="29.5" width="9" height="6.5" rx="3.5" fill="#FDDBB4"/>

  <!-- ══ LEFT ARM ══ -->
  <!-- Skin arm behind body -->
  <path d="M29.5,35 C24,41 20,49 18,57" stroke="#FDDBB4" stroke-width="9.5" stroke-linecap="round" fill="none"/>
  <!-- Sleeve cap (over skin) -->
  <path d="M29.5,35 C25.5,41 22.5,46 21,50" stroke="#A8D8EA" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Forearm -->
  <path d="M21,50 C19.5,54.5 17.5,58 16,62" stroke="#FDDBB4" stroke-width="8.5" stroke-linecap="round" fill="none"/>

  <!-- ══ RIGHT ARM ══ -->
  <path d="M70.5,35 C76,41 80,49 82,57" stroke="#FDDBB4" stroke-width="9.5" stroke-linecap="round" fill="none"/>
  <path d="M70.5,35 C74.5,41 77.5,46 79,50" stroke="#A8D8EA" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M79,50 C80.5,54.5 82.5,58 84,62" stroke="#FDDBB4" stroke-width="8.5" stroke-linecap="round" fill="none"/>

  <!-- ══ DRESS BODICE ══ -->
  <path d="M28,35 C36,31.5 50,31 64,31.5 C72,33 72,35 72,35 L69.5,58 L30.5,58 Z" fill="#A8D8EA"/>
  <!-- V-neck -->
