<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130">

  <!-- ══ HAIR (back layer) ══ -->
  <ellipse cx="50" cy="11" rx="14" ry="9" fill="#7B4F2E"/>
  <ellipse cx="32" cy="25" rx="5.5" ry="11.5" fill="#7B4F2E"/>
  <ellipse cx="68" cy="25" rx="5.5" ry="11.5" fill="#7B4F2E"/>

  <!-- ══ EARS ══ -->
  <ellipse cx="38.2" cy="17.5" rx="3" ry="4" fill="#F5C89A"/>
  <ellipse cx="61.8" cy="17.5" rx="3" ry="4" fill="#F5C89A"/>

  <!-- ══ HEAD ══ -->
  <ellipse cx="50" cy="17" rx="12.5" ry="13.5" fill="#FDDBB4"/>

  <!-- ══ BANGS ══ -->
  <path d="M37.5,10 C40,5.5 60,5.5 62.5,10 C62.5,10 61,16 57,15 C53,14 50,15 50,15 C50,15 47,14 43,15 C39,16 37.5,10 37.5,10 Z" fill="#7B4F2E"/>

  <!-- ══ FACE FEATURES ══ -->
  <!-- Eyebrows -->
  <path d="M41.5,12.5 Q44,11 46.5,12.5" stroke="#5C3317" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M53.5,12.5 Q56,11 58.5,12.5" stroke="#5C3317" stroke-width="0.9" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
