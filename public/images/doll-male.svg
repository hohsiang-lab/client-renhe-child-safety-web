<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130">

  <!-- ══ HAIR (back layer) ══ -->
  <ellipse cx="50" cy="10" rx="14" ry="9" fill="#5C3317"/>

  <!-- ══ EARS ══ -->
  <ellipse cx="38.2" cy="17.5" rx="3" ry="4" fill="#F5C89A"/>
  <ellipse cx="61.8" cy="17.5" rx="3" ry="4" fill="#F5C89A"/>

  <!-- ══ HEAD ══ -->
  <ellipse cx="50" cy="17" rx="12.5" ry="13.5" fill="#FDDBB4"/>

  <!-- ══ HAIR (front short cut) ══ -->
  <path d="M37.5,10 C40,4 60,4 62.5,10 C63,13 61,10 57,10 C53,10 50,11 50,11 C50,11 47,10 43,10 C39,10 37,13 37.5,10 Z" fill="#5C3317"/>
  <!-- Side hair -->
  <path d="M37.5,10 C36,12 36,16 37.5,19" stroke="#5C3317" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M62.5,10 C64,12 64,16 62.5,19" stroke="#5C3317" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- ══ FACE FEATURES ══ -->
  <!-- Eyebrows (straighter for boy) -->
  <path d="M41.5,12.5 L46.5,12" stroke="#5C3317" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M53.5,12 L58.5,12.5" stroke="#5C3317" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="44" cy="16" rx="2.3" ry="2.8" fill="#1A0F0A"/>
  <ellipse cx="56" cy="16" rx="2.3" ry="2.8" fill="#1A0F0A"/>
  <!-- Eye shine -->
  <ellipse cx="44.9" cy="15" rx="0.8" ry="1" fill="white"/>
  <ellipse cx="56.9" cy="15" rx="0.8" ry="1" fill="white"/>

  <!-- Nose -->
  <path d="M49,20.5 C49,21.5 50,22 51,21.5 L51,20.5" stroke="#D4956A" stroke-width="0.6" fill="none" stroke-linecap="round"/>

  <!-- Mouth (smile) -->
  <path d="M46.5,23 Q50,26 53.5,23" stroke="#C97060" stroke-width="1.1" fill="none" stroke-linecap="round"/>

  <!-- Blush cheeks -->
  <ellipse cx="41" cy="20" rx="4" ry="2.5" fill="#F08080" opacity="0.25"/>
  <ellipse cx="59" cy="20" rx="4" ry="2.5" fill="#F08080" opacity="0.25"/>

  <!-- ══ NECK ══ -->
  <rect x="45.5" y="29.5" width="9" height="6.5" rx="3.5" fill="#FDDBB4"/>

  <!-- ══ LEFT ARM ══ -->
  <path d="M29.5,38 C24,44 20,52 18,60" stroke="#FDDBB4" stroke-width="9.5" stroke-linecap="round" fill="none"/>
  <!-- Sleeve -->
  <path d="M29.5,38 C26,43 23,47 22,51" stroke="#4A90D9" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Forearm -->
  <path d="M22,51 C20,56 18,60 16.5,64" stroke="#FDDBB4" stroke-width="8.5" stroke-linecap="round" fill="none"/>

  <!-- ══ RIGHT ARM ══ -->
  <path d="M70.5,38 C76,44 80,52 82,60" stroke="#FDDBB4" stroke-width="9.5" stroke-linecap="round" fill="none"/>
  <path d="M70.5,38 C74,43 77,47 78,51" stroke="#4A90D9" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M78,51 C80,56 82,60 83.5,64" stroke="#FDDBB4" stroke-width="8.5" stroke-linecap="round" fill="none"/>

  <!-- ══ SHIRT ══ -->
  <path d="M28,38 C36,34 50,33 64,34 C72,36 72,38 72,38 L70,63 L30,63 Z" fill="#4A90D9"/>
  <!-- Collar -->
  <path d="M44,33.5 L50,39 L56,33.5" fill="#3A80C9" stroke="#2E70B9" stroke-width="0.5"/>
  <!-- Sleeve trim -->
  <path d="M28,38 C25.5,43 23.5,47 22,51" stroke="#3A80C9" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M72,38 C74.5,43 76.5,47 78,51" stroke="#3A80C9" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Shirt bottom -->
  <rect x="28" y="61" width="44" height="4" rx="2" fill="#3A80C9"/>

  <!-- ══ SHORTS ══ -->
  <path d="M29,63 L30,88 L48,88 L50,75 L52,88 L70,88 L71,63 Z" fill="#2C3E6B"/>
  <!-- Shorts pocket -->
  <path d="M33,66 L40,66 L40,73 L33,73 Z" fill="none" stroke="#1A2E5A" stroke-width="0.8" rx="1"/>
  <!-- Shorts hem -->
  <path d="M30,88 Q50,91 70,88" stroke="#1A2E5A" stroke-width="1.2" fill="none"/>

  <!-- ══ HANDS ══ -->
  <ellipse cx="14.5" cy="66.5" rx="5.5" ry="4.5" fill="#FDDBB4"/>
  <ellipse cx="85.5" cy="66.5" rx="5.5" ry="4.5" fill="#FDDBB4"/>
  <!-- Finger lines -->
  <path d="M11.5,65 L11.5,68.5" stroke="#D4956A" stroke-width="0.5" stroke-linecap="round"/>
  <path d="M14.5,64.3 L14.5,68.8" stroke="#D4956A" stroke-width="0.5" stroke-linecap="round"/>
  <path d="M17.5,65 L17.5,68.5" stroke="#D4956A" stroke-width="0.5" stroke-linecap="round"/>
  <path d="M82.5,65 L82.5,68.5" stroke="#D4956A" stroke-width="0.5" stroke-linecap="round"/>
  <path d="M85.5,64.3 L85.5,68.8" stroke="#D4956A" stroke-width="0.5" stroke-linecap="round"/>
  <path d="M88.5,65 L88.5,68.5" stroke="#D4956A" stroke-width="0.5" stroke-linecap="round"/>

  <!-- ══ LEGS ══ -->
  <rect x="33" y="87" width="14" height="25" rx="7" fill="#FDDBB4"/>
  <rect x="53" y="87" width="14" height="25" rx="7" fill="#FDDBB4"/>

  <!-- ══ SOCKS ══ -->
  <rect x="33.5" y="106" width="13" height="6" rx="3" fill="white"/>
  <rect x="53.5" y="106" width="13" height="6" rx="3" fill="white"/>
  <path d="M33.5,106.5 Q40,105 46.5,106.5" stroke="#DEDEDE" stroke-width="0.8" fill="none"/>
  <path d="M53.5,106.5 Q60,105 66.5,106.5" stroke="#DEDEDE" stroke-width="0.8" fill="none"/>

  <!-- ══ SHOES (sneakers) ══ -->
  <ellipse cx="40" cy="115" rx="9.5" ry="5" fill="#E74C3C"/>
  <ellipse cx="60" cy="115" rx="9.5" ry="5" fill="#E74C3C"/>
  <!-- Shoe stripe -->
  <path d="M32,114 Q40,111.5 48,114" stroke="white" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M52,114 Q60,111.5 68,114" stroke="white" stroke-width="1" fill="none" opacity="0.6"/>
  <!-- Shoe shine -->
  <ellipse cx="37.5" cy="113" rx="2.8" ry="1.5" fill="rgba(255,255,255,0.38)"/>
  <ellipse cx="57.5" cy="113" rx="2.8" ry="1.5" fill="rgba(255,255,255,0.38)"/>

</svg>
